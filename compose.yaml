services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: course_app
      POSTGRES_USER: course_app
      POSTGRES_PASSWORD: course_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_app -d course_app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
