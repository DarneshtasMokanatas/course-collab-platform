[project]
name = "course-collab-platform"
version = "0.1.0"
description = "Server-rendered academic course collaboration platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django==5.2.16",
    "gunicorn==23.0.0",
    "psycopg[binary]==3.3.4",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ012"]

[tool.ruff.format]
quote-style = "double"
