{% extends "base.html" %}
{% block title %}New version | {{ material.title }}{% endblock %}
{% block content %}
  <section class="form-card">
    <h1>New version: {{ material.title }}</h1>
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <div class="form-actions">
        <button type="submit">Upload version</button>
        <a href="{% url 'materials:list' course.id %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
