{% extends "base.html" %}
{% block title %}Add material | {{ course.code }}{% endblock %}
{% block content %}
  <section class="form-card">
    <h1>Add material</h1>
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <div class="form-actions">
        <button type="submit">Upload version 1</button>
        <a href="{% url 'materials:list' course.id %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
