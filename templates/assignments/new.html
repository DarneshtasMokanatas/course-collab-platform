{% extends "base.html" %}
{% block title %}New assignment | {{ course.code }}{% endblock %}
{% block content %}
<section class="hero">
  <p class="eyebrow">{{ course.code }}</p>
  <h1>New assignment</h1>
  <p>Create the draft first. Publishing is a separate confirmation step.</p>
</section>
<section>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <div class="form-actions">
      <button type="submit">Save draft</button>
      <a class="button-link" href="{% url 'assignments:list' course.id %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
