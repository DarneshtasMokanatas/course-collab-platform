{% if page.has_other_pages %}
  <nav class="pagination" aria-label="{{ pagination_label|default:'Result pages' }}">
    {% if page.has_previous %}
      <a class="button button-secondary" href="?page={{ page.previous_page_number }}{% if query_suffix %}&amp;{{ query_suffix }}{% endif %}" rel="prev">Previous</a>
    {% endif %}
    <span class="pagination-status" aria-current="page">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
      <a class="button button-secondary" href="?page={{ page.next_page_number }}{% if query_suffix %}&amp;{{ query_suffix }}{% endif %}" rel="next">Next</a>
    {% endif %}
  </nav>
{% endif %}
