<nav class="course-tabs" aria-label="{{ course.code }} course sections">
  <a href="{% url 'courses:detail' course.id %}" {% if active_tab == "overview" %}aria-current="page"{% endif %}>Overview</a>
  <a href="{% url 'announcements:list' course.id %}" {% if active_tab == "announcements" %}aria-current="page"{% endif %}>Announcements</a>
  <a href="{% url 'materials:list' course.id %}" {% if active_tab == "materials" %}aria-current="page"{% endif %}>Materials</a>
  <a href="{% url 'assignments:list' course.id %}" {% if active_tab == "assignments" %}aria-current="page"{% endif %}>Assignments</a>
  {% if user.role == "INSTRUCTOR" or user.is_staff %}
    <a href="{% url 'analytics:course' course.id %}" {% if active_tab == "analytics" %}aria-current="page"{% endif %}>Platform activity</a>
  {% endif %}
</nav>
